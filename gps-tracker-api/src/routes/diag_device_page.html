<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단말 수신 로그</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; margin: 0; background: #f5f6f8; color: #1a1a1a; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 8px 0 2px; }
  .sub { color: #667; font-size: 12px; margin-bottom: 10px; }
  .pager { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #fff; border: 1px solid #dde; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
  .pager button { font-size: 13px; padding: 5px 12px; border: 1px solid #bcd; background: #f7faff; border-radius: 6px; cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .pager .info { color: #445; margin-left: auto; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .card { background: #fff; border: 1px solid #dde; border-radius: 8px; padding: 12px 18px; min-width: 130px; }
  .card .k { font-size: 12px; color: #667; }
  .card .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .card .t { font-size: 11px; color: #99a; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #dde; font-size: 13px; }
  th, td { padding: 6px 10px; border-bottom: 1px solid #eef; text-align: right; white-space: nowrap; }
  th { background: #f0f2f5; position: sticky; top: 0; }
  th:first-child, td:first-child { text-align: left; }
  .tablewrap { overflow-x: auto; }
  .stale { color: #c33; font-weight: 600; }
  .ok { color: #283; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>단말 수신 로그</h1>
  <div class="sub">device: <span id="dev">-</span> · GPS 없이도 HTTP 수신마다 1행 · 시각은 KST(절대시각) · 최신 페이지 10초 자동 갱신 · 상태: <span id="live">-</span></div>

  <div class="pager">
    <button id="btnLatest">최신</button>
    <button id="btnNewer">◀ 다음(최신쪽)</button>
    <button id="btnOlder">이전(과거쪽) ▶</button>
    <span class="info"><span id="pageNo">-</span> / <span id="pageMax">-</span> 페이지 (1페이지=1시간) · 전체 <span id="total">-</span>건 · 구간 <span id="range">-</span></span>
  </div>

  <div class="cards">
    <div class="card"><div class="k">단말 업타임</div><div class="v" id="up">-</div><div class="t" id="upat">-</div></div>
    <div class="card"><div class="k">신호 CSQ</div><div class="v" id="csq">-</div><div class="t" id="band">-</div></div>
    <div class="card"><div class="k">배터리</div><div class="v" id="vbat">-</div><div class="t" id="cbc">-</div></div>
  </div>

  <div class="tablewrap">
  <table>
    <thead><tr><th>KST 시각</th><th>업타임</th><th>CSQ</th><th>등록</th><th>밴드</th><th>배터리(mV)</th><th>모듈(mV)</th><th>GPS</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
</div>
<script>
var PAGE = 240;
var page = 0;
var totalPages = 1;
var uid = new URLSearchParams(location.search).get('uid') || '';
document.getElementById('dev').textContent = uid || '(uid 파라미터 필요: ?uid=esp-…)';

function hms(sec) {
  sec = parseInt(sec, 10);
  if (isNaN(sec)) return '-';
  var h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  return (h ? h + '시간 ' : '') + m + '분 ' + s + '초';
}
async function load() {
  if (!uid) return;
  try {
    const r = await fetch('/diagnostic/device/data?uid=' + encodeURIComponent(uid) + '&limit=' + PAGE + '&offset=' + (page * PAGE));
    const d = await r.json();
    if (d.error) { document.getElementById('live').textContent = '조회 불가 (' + d.error + ')'; return; }
    const items = d.items;
    totalPages = Math.max(1, Math.ceil(d.total / PAGE));
    if (page >= totalPages) page = totalPages - 1;
    document.getElementById('total').textContent = d.total;
    document.getElementById('pageNo').textContent = page + 1;
    document.getElementById('pageMax').textContent = totalPages;
    document.getElementById('btnLatest').disabled = (page === 0);
    document.getElementById('btnNewer').disabled = (page === 0);
    document.getElementById('btnOlder').disabled = (page >= totalPages - 1);

    document.getElementById('rows').innerHTML = items.map(function(it) {
      var gps = it.fix === 'true' ? ('수신(' + (it.sat || '?') + '위성)') : '없음';
      return '<tr><td>' + it.kst + '</td><td>' + hms(it.ts) + '</td><td>' + (it.csq || '-') +
             '</td><td>' + (it.reg || '-') + '</td><td>' + (it.band || '-') +
             '</td><td>' + (it.vbat_mv || '-') + '</td><td>' + (it.cbc_mv || '-') +
             '</td><td>' + gps + '</td></tr>';
    }).join('');

    if (items.length) {
      document.getElementById('range').textContent = items[items.length - 1].kst + ' ~ ' + items[0].kst;
      const top = items[0];
      document.getElementById('up').textContent = hms(top.ts);
      document.getElementById('upat').textContent = top.kst + (page === 0 ? '' : ' (과거 페이지)');
      document.getElementById('csq').textContent = top.csq || '-';
      document.getElementById('band').textContent = '밴드 ' + (top.band || '-') + ' · 등록 ' + (top.reg || '-');
      document.getElementById('vbat').textContent = top.vbat_mv ? top.vbat_mv + ' mV' : '-';
      document.getElementById('cbc').textContent = top.cbc_mv ? '모듈 ' + top.cbc_mv + ' mV' : '';
      if (page === 0) {
        const last = new Date(top.kst.replace(' ', 'T') + '+09:00').getTime();
        const ageS = Math.round((Date.now() - last) / 1000);
        const live = document.getElementById('live');
        if (ageS > 60) { live.textContent = '끊김 (' + ageS + '초 전 마지막 수신)'; live.className = 'stale'; }
        else { live.textContent = '수신 중 (' + ageS + '초 전)'; live.className = 'ok'; }
      }
    }
  } catch (e) { document.getElementById('live').textContent = '조회 실패'; }
}
document.getElementById('btnLatest').onclick = function() { page = 0; load(); };
document.getElementById('btnNewer').onclick = function() { if (page > 0) { page--; load(); } };
document.getElementById('btnOlder').onclick = function() { if (page < totalPages - 1) { page++; load(); } };
load();
setInterval(function() { if (page === 0) load(); }, 10000);
</script>
</body>
</html>
