[package]
name = "gps-pdf-render"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
description = "Isolated PDF page rasterizer: one page of one stored PDF per process, behind a system-call allowlist"

# Built on its own toolchain (rust-toolchain.toml, ops/pdf-builder.Dockerfile) as a static binary.
# The API keeps its pinned toolchain and only talks to this program through two pipes.

[dependencies]
hayro = "=0.9.0"                 # pure-Rust PDF rasterizer (forbids unsafe code)
seccompiler = "=0.5.0"           # system-call allowlist
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
strip = true
panic = "unwind"                 # a renderer panic becomes an error reply, not a crash
