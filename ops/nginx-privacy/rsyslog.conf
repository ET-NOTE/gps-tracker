# A separate local-only instance: the host's rsyslog service/config is not changed.
module(load="imuxsock" SysSock.Use="off")
template(name="gps_safe_error" type="list") {
    constant(value="{\"time\":\"")
    property(name="timegenerated" dateFormat="rfc3339")
    constant(value="\",\"severity\":\"")
    property(name="syslogseverity-text" format="json")
    constant(value="\",\"category\":\"")
    property(name="$!gps_category" format="json")
    constant(value="\"}\n")
}
ruleset(name="gps_errors") {
    # Never write raw msg, hostname, tag, request, upstream, referrer or filesystem paths.
    set $!gps_category = "other";
    if ($msg contains "connect() failed") then set $!gps_category = "upstream_connect";
    else if ($msg contains "timed out") then set $!gps_category = "timeout";
    else if ($msg contains "SSL" or $msg contains "certificate") then set $!gps_category = "tls";
    else if ($msg contains "limiting requests") then set $!gps_category = "rate_limit";
    else if ($msg contains "Permission denied" or $msg contains "open()") then set $!gps_category = "filesystem";
    else if ($msg contains "closed connection") then set $!gps_category = "connection_closed";
    action(type="omfile" file="/var/log/gps-nginx/errors.log" template="gps_safe_error" fileCreateMode="0640")
    stop
}
input(type="imuxsock" Socket="/run/gps-nginx-log/errors.sock" CreatePath="on" Ruleset="gps_errors" RateLimit.Interval="0")
