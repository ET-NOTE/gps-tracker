# http context. Only constant route labels enter logs; query strings, raw request lines,
# referrers, user agents and arbitrary path segments must never enter this format.
map $request_method $gps_log_method {
    default OTHER;
    GET GET; POST POST; PUT PUT; PATCH PATCH; DELETE DELETE; HEAD HEAD; OPTIONS OPTIONS;
}
map $uri $gps_log_route {
    default /other;
    /health /health;
    /gps-tracker/health /health;
    /ingest /ingest;
    /gps-tracker/ingest /ingest;
    ~^/(gps-tracker/)?ws/ /ws/:stream;
    ~^/(gps-tracker/)?api/v1/share/ /api/v1/share/:redacted;
    ~^/(gps-tracker/)?api/v1/auth/ /api/v1/auth/:action;
    ~^/(gps-tracker/)?api/v1/admin/ /api/v1/admin/:resource;
    ~^/(gps-tracker/)?api/v1/privacy/ /api/v1/privacy/:resource;
    ~^/(gps-tracker/)?api/v1/devices /api/v1/devices/:resource;
    ~^/(gps-tracker/)?api/v1/corporate/ /api/v1/corporate/:resource;
    ~^/(gps-tracker/)?api/ /api/:resource;
    ~^/share/ /share/:redacted;
    ~^/assets/ /assets/:file;
    ~^/uploads/ /uploads/:file;
    / /;
    /login /login;
    /profile /profile;
    /devices /devices;
    /corporate /corporate;
    /rentcar /rentcar;
}
log_format gps_private escape=json
    '{"time":"$time_iso8601","client":"$remote_addr","method":"$gps_log_method",'
    '"route":"$gps_log_route","status":$status,"bytes":$body_bytes_sent,'
    '"seconds":$request_time}';
