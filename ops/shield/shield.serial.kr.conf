# Include from nginx http{} through sites-enabled after TLS issuance and approval.
# These names are unique to Shield; existing GPS upstreams/locations are untouched.
limit_req_zone $binary_remote_addr zone=shield_auth:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=shield_ingest:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=shield_images:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=shield_connections:1m;
map $http_upgrade $shield_connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name shield.serial.kr;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    # Firmware must use HTTPS directly. POST bodies are never forwarded over HTTP.
    location / { return 308 https://shield.serial.kr$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shield.serial.kr;
    ssl_certificate /etc/letsencrypt/live/shield.serial.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shield.serial.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/shield/current/web;
    index index.html;
    client_max_body_size 8k;
    access_log /var/log/nginx/shield.access.log;
    error_log /var/log/nginx/shield.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.tosspayments.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' wss://shield.serial.kr https://*.tosspayments.com; frame-src https://*.tosspayments.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.tosspayments.com" always;

    location ^~ /api/auth/ {
        limit_req zone=shield_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3043;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/ws {
        limit_conn shield_connections 10;
        proxy_pass http://127.0.0.1:3043;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $shield_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
    location = /api/admin/post-images {
        client_max_body_size 2m;
        limit_req zone=shield_images burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3043;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 25s;
    }
    location = /api/admin/post-files {
        client_max_body_size 5m;
        limit_req zone=shield_images burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3043;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 25s;
    }
    location /api/ {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:3043;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 25s;
    }
    location = /ingest/shield {
        limit_req zone=shield_ingest burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3043;
        proxy_set_header Host $host;
        proxy_read_timeout 25s;
    }
    location = /health { return 404; }
    location ^~ /assets/ { expires 1y; try_files $uri =404; }
    location ^~ /downloads/ { try_files $uri =404; }
    # Payment return queries contain a payment key; never write them to access logs.
    location ~ ^/points/(success|fail)$ {
        access_log off;
        try_files /index.html =404;
    }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
