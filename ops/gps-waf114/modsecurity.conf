# Request inspection only; no response content inspection or stored request bodies.
# Keep production detection-only until large photo JSON false positives are resolved.
SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecRequestBodyLimit 41943040
SecRequestBodyNoFilesLimit 41943040
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 64
SecArgumentsLimit 2000
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000
SecResponseBodyAccess Off
SecTmpDir /tmp
SecDataDir /tmp
SecUploadDir /tmp
SecUploadKeepFiles Off
SecTmpSaveUploadedFiles Off
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
# A/Z only: no headers, query, body, response, or matched values.
SecAuditLogParts AZ
SecAuditLogType Serial
SecAuditLogFormat Native
SecAuditLog /logs/audit.log
SecDebugLogLevel 0
SecUnicodeMapFile /etc/modsecurity.d/unicode.mapping 20127
SecStatusEngine Off
SecArgumentSeparator &
SecRule REQUEST_HEADERS:Content-Type "^application/(?:[a-z0-9.-]+[+])?json" "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap[+]|/)|text/)xml" "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQBODY_ERROR "!@eq 0" "id:200002,phase:2,t:none,deny,status:400,nolog,auditlog,msg:'Request body parse failure'"
SecRule MULTIPART_STRICT_ERROR "!@eq 0" "id:200003,phase:2,t:none,deny,status:400,nolog,auditlog,msg:'Multipart parse failure'"
SecRule MULTIPART_UNMATCHED_BOUNDARY "@eq 1" "id:200004,phase:2,t:none,deny,status:400,nolog,auditlog,msg:'Multipart boundary failure'"
SecRule &ARGS "@ge 2000" "id:200007,phase:2,t:none,deny,status:400,nolog,auditlog,msg:'Too many arguments'"
Include /opt/owasp-crs/crs-setup.conf
SecAction "id:900110,phase:1,pass,nolog,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"
SecAction "id:900000,phase:1,pass,nolog,setvar:tx.blocking_paranoia_level=1"
Include /opt/owasp-crs/rules/*.conf
