load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;
worker_processes 1;
pid /tmp/nginx.pid;
error_log syslog:server=unix:/run/gps-errors/errors.sock,tag=gps_waf,nohostname error;
events { worker_connections 512; }
http {
    # No raw URL, query, token, body, user identity or client IP in this diagnostic log.
    log_format decisions escape=json '{"at":"$time_iso8601","method":"$request_method","status":$status,"upstream":"$upstream_status","seconds":$request_time}';
    access_log /logs/decisions.log decisions;
    server_tokens off;
    client_max_body_size 40m;
    client_body_buffer_size 128k;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    scgi_temp_path /tmp/scgi;
    uwsgi_temp_path /tmp/uwsgi;
    client_body_timeout 60s;
    keepalive_timeout 30s;
    map $http_upgrade $upgrade_connection { default upgrade; '' close; }
    map $http_x_forwarded_proto $origin_scheme { default $http_x_forwarded_proto; '' http; }
    modsecurity on;
    modsecurity_rules_file /etc/gps-waf/modsecurity.conf;
    server {
        # Host networking is used only to reach the existing loopback-only API.
        # No wildcard listener or Docker-published public port.
        listen 127.0.0.1:3045;
        server_name _;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Real-IP;
        location / {
            proxy_pass http://127.0.0.1:3040;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $origin_scheme;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $upgrade_connection;
            proxy_connect_timeout 5s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }
    }
}
