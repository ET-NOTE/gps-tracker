# GPS 외부 감시 설정. ~/.config/gps-watch/config.ini 로 두고 본인만 읽게 한다(chmod 600).
# 메일 비밀번호가 들어가므로 다른 계정이 읽을 수 있으면 감시가 실행을 거부한다.
# 값 뒤에 주석을 붙이지 않는다(줄 전체가 값으로 읽힌다).

[mail]
# 보내는 메일 서버. 네이버: smtp.naver.com / 587 / starttls (메일 환경설정에서 SMTP 사용을 켜야 한다)
#                  지메일: smtp.gmail.com / 587 / starttls (앱 비밀번호 필요)
host = smtp.naver.com
port = 587
# starttls(587) 또는 ssl(465)
security = starttls
username =
password =
# 보내는 주소(대개 username 과 같은 계정의 주소)와 받는 주소. 받는 주소는 쉼표로 여러 개 가능.
from =
to =

[heartbeat]
# Uptime Kuma 의 Push 모니터 주소(예: https://status.serial.kr/api/push/…). 화면에 나온 주소를 그대로 붙여도 된다(? 뒤는 무시한다).
# 감시가 한 번 돌 때마다 "살아 있음"을 보낸다. 비워 두면 보내지 않는다.
url =

[watch]
# 아래는 기본값이다. 바꿀 때만 주석을 풀어 쓴다.
# 연속 몇 번 실패하면 장애로 보고, 연속 몇 번 성공하면 복구로 보는가(감시는 1분마다 돈다)
# fail_after = 3
# recover_after = 2
# 장애가 계속될 때 다시 알리는 간격(분)
# remind_minutes = 60
# 감시 위치의 인터넷이 이 시간(분) 이상 끊겼다가 돌아오면 공백을 알린다
# gap_minutes = 5
# timeout_seconds = 10

[checks]
# 기본값. 주소를 비우면 그 점검을 끈다.
# health = https://gps.serial.kr/health
# ingest = http://gps.serial.kr/ingest
# ssh = gps.serial.kr:22
# status = https://status.serial.kr/
# 감시 위치 자신의 인터넷을 확인하는 주소(하나라도 답하면 인터넷 정상으로 본다)
# references = https://www.gstatic.com/generate_204, https://www.naver.com/

# 22C 후보 활성화 후에만 설정. 별도 SELECT-only 감시 계정의 forced-command SSH 별칭.
# 공개 포트/관리자 MFA 토큰/DB 비밀번호를 이 값에 넣지 않는다. 빈 값이면 기존 감시만 수행.
# notice_queue_ssh = gps-notice-monitor
