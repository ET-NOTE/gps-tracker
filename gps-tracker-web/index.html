    <!-- 인앱 WebView 우회 — 카톡/네이버는 외부 브라우저로 강제 redirect.
         앱이 아직 출시 안 된 응급 조치. App Links 등록 후에도 카톡 인앱뷰는
         App Link 검증을 우회하므로 이 스크립트는 계속 필요. -->
    <script>
      (function() {
        // Flutter 앱 자체의 WebView 면 스킵 — JS 채널 존재로 식별
        if (window.FlutterAppOpenUrl) return;
        var ua = navigator.userAgent || '';
        var url = location.href;
        if (/KAKAOTALK/i.test(ua)) {
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
          return;
        }
        if (/NAVER\(inapp/i.test(ua)) {
          location.href = 'naversearchapp://inappbrowser/close?autoOpenInNewTab=true&url=' + encodeURIComponent(url);
          return;
        }
        // FB/Instagram/Line/Twitter — 외부 강제 스킴이 없거나 비공식.
        // DOM 준비되면 상단에 안내 배너 노출.
        if (/Instagram|FBAN|FBAV|FBIOS|Twitter|Line\//i.test(ua)) {
          var show = function() {
            if (document.getElementById('inapp-banner')) return;
            var d = document.createElement('div');
            d.id = 'inapp-banner';
            d.style.cssText = [
              'position:fixed','top:0','left:0','right:0','z-index:99999',
              'background:#1A1A2E','color:#fff','padding:14px 16px',
              'font-size:13px','font-family:-apple-system,system-ui,sans-serif',
              'line-height:1.5','box-shadow:0 2px 8px rgba(0,0,0,.3)',
            ].join(';');
            d.innerHTML =
              '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">' +
                '<div>인앱 브라우저는 일부 기능이 제한됩니다.<br>' +
                  '<b>오른쪽 위 메뉴 → Chrome/Safari로 열기</b> 를 눌러주세요.' +
                '</div>' +
                '<button id="inapp-banner-x" style="background:transparent;border:none;color:#aaa;font-size:18px;cursor:pointer;padding:0 4px">×</button>' +
              '</div>';
            document.body.appendChild(d);
            document.getElementById('inapp-banner-x').onclick = function(){ d.remove(); };
          };
          if (document.readyState === 'loading')
            document.addEventListener('DOMContentLoaded', show);
          else show();
        }
      })();
    </script>
    <script type="text/javascript"
      src="//dapi.kakao.com/v2/maps/sdk.js?appkey=760ec0841163d1ee2cc5fef220a9df0b&libraries=services,clusterer&autoload=false">
    </script>
  </head>
